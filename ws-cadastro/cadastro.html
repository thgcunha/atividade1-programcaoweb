<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cadastro de produtos e códigos RFID no Sistema RFID.">
  <title>Cadastro de Produtos | Sistema RFID</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Cadastro de Produtos RFID</h1>
  </header>

  <main>
    <form action="/produtos" method="post">
      <fieldset>
        <legend>Novo Produto</legend>

        <label for="nome">Nome do Produto</label>
        <input type="text" id="nome" name="nome" required>

        <label for="rfid">Código RFID</label>
        <input type="text" id="rfid" name="rfid" required>

        <label for="categoria">Categoria</label>
        <input type="text" id="categoria" name="categoria" required>

        <label for="preco">Preço</label>
        <input type="number" id="preco" name="preco" min="0" step="0.01" required>

        <button type="submit">Salvar</button>
      </fieldset>
    </form>

    <section>
      <h2>Produtos Cadastrados</h2>
      <article>
        <h3>Produto Exemplo</h3>
        <p>RFID: 123456789</p>
        <p>Categoria: Eletrônicos</p>
        <p>Preço: R$ 199,90</p>
      </article>
    </section>
  </main>

  <aside>
    <p>Digite o código RFID no campo acima. A leitura automática depende de um backend.</p>
  </aside>

  <footer>
    <p><a href="login.html">Voltar ao login</a></p>
    <p>&copy; 2026 Sistema RFID</p>
  </footer>
</body>
</html>
