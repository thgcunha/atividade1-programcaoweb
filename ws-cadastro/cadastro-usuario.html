<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cadastro de usuário no Sistema RFID.">
  <title>Cadastrar-se | Sistema RFID</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="account-page">
  <header>
    <h1>Sistema RFID</h1>
  </header>

  <main>
    <form action="/usuarios" method="post">
      <fieldset>
        <legend>Criar conta</legend>

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" autocomplete="name" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" autocomplete="new-password" required>

        <button type="submit">Cadastrar</button>
      </fieldset>
    </form>
  </main>

  <footer>
    <p>Já tem conta? <a href="login.html">Entrar</a></p>
  </footer>
</body>
</html>
